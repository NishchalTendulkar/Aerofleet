<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cutaway Jet - Interactive Systems Inspector</title>
  <!-- Embedded Model Data -->
  <script src="model_data.js"></script>

  <!-- Three.js + Loaders + Controls + Exporter -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/exporters/GLTFExporter.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: radial-gradient(circle at 50% 30%, #1e293b 0%, #0b1120 100%);
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      display: flex;
      position: relative;
    }

    #canvas-container {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      outline: none;
    }

    /* Top Bar Header */
    header {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      padding: 10px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(11, 17, 32, 0.85);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      z-index: 20;
    }
    .title-group h1 {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: -0.01em;
      color: #ffffff;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .badge {
      font-size: 11px;
      padding: 2px 8px;
      background: rgba(56, 189, 248, 0.15);
      color: #38bdf8;
      border: 1px solid rgba(56, 189, 248, 0.3);
      border-radius: 999px;
      font-weight: 600;
    }
    .header-controls {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .hdr-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #f1f5f9;
      padding: 6px 14px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .hdr-btn:hover {
      background: rgba(255, 255, 255, 0.16);
      border-color: rgba(255, 255, 255, 0.3);
    }
    .hdr-btn.active {
      background: #0284c7;
      border-color: #38bdf8;
    }

    /* Systems Control Panel (Matches user UI mockup accurately) */
    .systems-panel {
      position: absolute;
      top: 60px;
      left: 18px;
      width: 228px;
      background: #ffffff;
      color: #111827;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      padding: 14px 14px 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
      z-index: 25;
      font-size: 13px;
      user-select: none;
    }

    .systems-panel h3 {
      font-size: 14px;
      font-weight: 700;
      color: #0f172a;
      margin-bottom: 8px;
      font-family: inherit;
    }

    .checkbox-list {
      display: flex;
      flex-direction: column;
      gap: 4.5px;
      margin-bottom: 12px;
    }

    .check-item {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      color: #1e293b;
      letter-spacing: 0.01em;
    }
    .check-item input[type="checkbox"] {
      appearance: none;
      -webkit-appearance: none;
      width: 14px;
      height: 14px;
      border: 1.5px solid #0284c7;
      border-radius: 3px;
      outline: none;
      cursor: pointer;
      display: grid;
      place-content: center;
      background: #ffffff;
      transition: all 0.12s ease;
      flex-shrink: 0;
    }
    .check-item input[type="checkbox"]:checked {
      background: #0284c7;
      border-color: #0284c7;
    }
    .check-item input[type="checkbox"]:checked::before {
      content: "";
      width: 7px;
      height: 4.5px;
      border-left: 2px solid #ffffff;
      border-bottom: 2px solid #ffffff;
      transform: rotate(-45deg) translate(0.5px, -0.5px);
    }

    .slider-group {
      margin-bottom: 10px;
    }
    .slider-group label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: #1e293b;
      margin-bottom: 3px;
    }
    .slider-group input[type="range"] {
      width: 100%;
      height: 5px;
      border-radius: 3px;
      background: #e2e8f0;
      outline: none;
      -webkit-appearance: none;
      cursor: pointer;
    }
    .slider-group input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 15px;
      height: 15px;
      border-radius: 50%;
      background: #0284c7;
      cursor: pointer;
      box-shadow: 0 1px 3px rgba(2, 132, 199, 0.4);
      transition: transform 0.1s ease;
    }
    .slider-group input[type="range"]::-webkit-slider-thumb:hover {
      transform: scale(1.15);
    }

    .action-buttons {
      display: flex;
      gap: 6px;
      margin: 8px 0 6px;
    }
    .panel-btn {
      flex: 1;
      padding: 5px 8px;
      background: #f8fafc;
      border: 1px solid #94a3b8;
      border-radius: 4px;
      font-size: 11.5px;
      font-weight: 500;
      color: #0f172a;
      cursor: pointer;
      transition: all 0.15s ease;
      text-align: center;
    }
    .panel-btn:hover {
      background: #e2e8f0;
      border-color: #64748b;
    }
    .panel-btn:active {
      background: #cbd5e1;
    }
    .panel-btn.full-width {
      width: 100%;
      display: block;
      margin-bottom: 8px;
    }

    .panel-footer-hint {
      font-size: 11px;
      color: #475569;
      margin-top: 6px;
      font-style: normal;
    }

    /* Selected Part Info Toast */
    #selection-badge {
      position: absolute;
      bottom: 22px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.92);
      border: 1px solid rgba(56, 189, 248, 0.4);
      border-radius: 999px;
      padding: 7px 20px;
      font-size: 12px;
      color: #f1f5f9;
      display: flex;
      align-items: center;
      gap: 10px;
      backdrop-filter: blur(10px);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      z-index: 20;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }
    #selection-badge .system-tag {
      background: #0284c7;
      color: #ffffff;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 10.5px;
      font-weight: 700;
      letter-spacing: 0.03em;
    }

    /* Loading overlay */
    #loading-indicator {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(15, 23, 42, 0.92);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      padding: 20px 28px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      z-index: 50;
      color: #e2e8f0;
      font-size: 14px;
      font-weight: 500;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid rgba(56, 189, 248, 0.2);
      border-top-color: #38bdf8;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    #status-msg {
      font-size: 12px;
      color: #94a3b8;
    }

    /* Studio Render Overlay View */
    #render-overlay {
      position: absolute;
      inset: 0;
      background: #0b1120;
      z-index: 15;
      display: none;
      justify-content: center;
      align-items: center;
      padding: 60px 24px 24px;
    }
    #render-overlay.active {
      display: flex;
    }
    #render-overlay img {
      max-width: 95%;
      max-height: 90%;
      object-fit: contain;
      border-radius: 12px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.7);
    }
  </style>
</head>
<body>
  <header>
    <div class="title-group">
      <h1>Cutaway Fighter Jet <span class="badge">Systems Interactive</span></h1>
    </div>
    <div class="header-controls">
      <button class="hdr-btn active" id="btn-3d-view">Interactive 3D</button>
      <button class="hdr-btn" id="btn-render-view">Cycles Studio Render</button>
      <button class="hdr-btn" id="btn-reset-cam">Reset View</button>
    </div>
  </header>

  <!-- 3D WebGL Canvas Container -->
  <div id="canvas-container"></div>

  <!-- Studio Still Image View -->
  <div id="render-overlay">
    <img src="preview_render_1.png" alt="Cycles Ray-Traced Cutaway Jet Render">
  </div>

  <!-- Systems Control Panel -->
  <div class="systems-panel">
    <h3>Systems</h3>

    <div class="checkbox-list">
      <label class="check-item">
        <input type="checkbox" id="chk-AIRFRAME" checked data-system="AIRFRAME">
        AIRFRAME
      </label>
      <label class="check-item">
        <input type="checkbox" id="chk-ENGINE" checked data-system="ENGINE">
        ENGINE
      </label>
      <label class="check-item">
        <input type="checkbox" id="chk-HYDRAULICS" checked data-system="HYDRAULICS">
        HYDRAULICS
      </label>
      <label class="check-item">
        <input type="checkbox" id="chk-ELECTRICAL" checked data-system="ELECTRICAL">
        ELECTRICAL
      </label>
      <label class="check-item">
        <input type="checkbox" id="chk-AVIONICS" checked data-system="AVIONICS">
        AVIONICS
      </label>
      <label class="check-item">
        <input type="checkbox" id="chk-FLIGHT_CONTROL" checked data-system="FLIGHT_CONTROL">
        FLIGHT_CONTROL
      </label>
      <label class="check-item">
        <input type="checkbox" id="chk-FUEL" checked data-system="FUEL">
        FUEL
      </label>
      <label class="check-item">
        <input type="checkbox" id="chk-LANDING_GEAR" checked data-system="LANDING_GEAR">
        LANDING_GEAR
      </label>
    </div>

    <div class="slider-group">
      <label for="slider-shell">Shell opacity</label>
      <input type="range" id="slider-shell" min="0" max="1" step="0.01" value="1.0">
    </div>

    <div class="slider-group">
      <label for="slider-explode" style="display: flex; justify-content: space-between; align-items: center;">
        <span>Explode</span>
        <span id="explode-val" style="color: #0284c7; font-weight: 700;">0%</span>
      </label>
      <input type="range" id="slider-explode" min="0" max="1" step="0.01" value="0">
    </div>

    <label class="check-item" style="margin-bottom: 8px;">
      <input type="checkbox" id="chk-animate" checked>
      Animate rotors & actuators
    </label>

    <div class="action-buttons">
      <button class="panel-btn" id="btn-explode-toggle">Explode view</button>
      <button class="panel-btn" id="btn-isolate-engine">Isolate engine</button>
    </div>

    <div class="action-buttons">
      <button class="panel-btn" id="btn-show-all">Show all</button>
      <button class="panel-btn" id="btn-export-glb">Export GLB</button>
    </div>

    <div class="panel-footer-hint">Click a part to select its system</div>
  </div>

  <!-- Bottom Interactive Selection Badge -->
  <div id="selection-badge">
    <span>Inspecting: <strong id="selected-part-name">Full Aircraft</strong></span>
    <span class="system-tag" id="selected-part-system">AIRFRAME</span>
  </div>

  <!-- Loading Overlay -->
  <div id="loading-indicator">
    <div class="spinner"></div>
    <div>Loading Cutaway Aircraft Model...</div>
    <div id="status-msg">Initializing geometry</div>
  </div>

  <script>
    // Precise subsystem classification matching cutaway_jet.py components
    function classifyMeshSystem(name) {
      const lower = name.toLowerCase();

      // 1. HYDRAULICS: Wing hydraulic lines, brake pressure hoses, landing gear hydraulic retraction cylinders and oleo shock pistons
      if (
        lower.includes('hydraulic') ||
        lower.includes('brake hose') ||
        lower.includes('gear cylinder') ||
        lower.includes('chrome piston')
      ) {
        return 'HYDRAULICS';
      }

      // 2. FUEL SYSTEM: Fuselage fuel cells (Olive center reservoir, Upper cylindrical reservoir, straps) and external wing drop tanks & pylons
      if (
        lower.includes('reservoir') ||
        lower.includes('tank ') ||
        lower.startsWith('tank')
      ) {
        return 'FUEL';
      }

      // 3. LANDING GEAR: Wheels, tires, rims, axles, doors, forks, struts, drag braces, collars
      if (
        lower.includes('wheel') ||
        lower.includes('tire') ||
        lower.includes('tread') ||
        lower.includes('wheel rim') ||
        lower.includes('gear door') ||
        lower.includes('axle') ||
        lower.includes('gear fork') ||
        lower.includes('strut') ||
        lower.includes('drag brace') ||
        lower.includes('wheel lug') ||
        lower.includes('diagonal support') ||
        lower.includes('strut collar')
      ) {
        return 'LANDING_GEAR';
      }

      // 4. ENGINE: Turbines, rotor hubs, compressor blades, combustor, engine casing, central shaft, nozzle petals, hoops, retaining rings
      if (
        lower.includes('engine') ||
        lower.includes('turbine') ||
        lower.includes('rotor hub') ||
        lower.includes('blade') ||
        lower.includes('combust') ||
        lower.includes('nozzle') ||
        lower.includes('exhaust') ||
        lower.includes('chamber') ||
        lower.includes('sleeve') ||
        lower.includes('petal') ||
        lower.includes('drum') ||
        lower.includes('casing')
      ) {
        return 'ENGINE';
      }

      // 5. FLIGHT CONTROL: Pilot control stick/grip, tandem ejection seats & harnesses, rudder flight surfaces, trailing control panels
      if (
        lower.includes('rudder') ||
        lower.includes('control stick') ||
        lower.includes('control grip') ||
        lower.includes('control panel') ||
        lower.includes('seat') ||
        lower.includes('harness') ||
        lower.includes('head rest') ||
        lower.includes('cushion')
      ) {
        return 'FLIGHT_CONTROL';
      }

      // 6. ELECTRICAL: Wiring harnesses, electrical command cables, navigation and marker lights
      if (
        lower.includes('wire') ||
        lower.includes('wiring') ||
        lower.includes('loom') ||
        lower.includes('cable') ||
        lower.includes('light') ||
        lower.includes('marker')
      ) {
        return 'ELECTRICAL';
      }

      // 7. AVIONICS: Flight instruments, displays, HUD glass, radar nose radome, Pitot probe, avionics bays, circuit boards, antennas, equipment trays & decks
      if (
        lower.includes('avionics') ||
        lower.includes('instrument') ||
        lower.includes('display') ||
        lower.includes('hud') ||
        lower.includes('circuit') ||
        lower.includes('board') ||
        lower.includes('cooling rib') ||
        lower.includes('identification plate') ||
        lower.includes('radome') ||
        lower.includes('probe') ||
        lower.includes('antenna') ||
        lower.includes('equipment tray') ||
        lower.includes('equipment deck')
      ) {
        return 'AVIONICS';
      }

      // 8. AIRFRAME: Fuselage skins, structural frames, wing spars & ribs, vertical fin, canopy glazing & arches, hatches, engine intakes
      return 'AIRFRAME';
    }

    // Physically structured explosion displacement calculated from TRUE 3D world geometric centers
    function getExplosionVector(mesh, systemName, worldCenter, modelCenter) {
      const lower = mesh.name.toLowerCase();
      const cx = worldCenter.x;
      const cy = worldCenter.y;
      const cz = worldCenter.z;
      const vec = new THREE.Vector3();

      // 1. LANDING GEAR
      if (systemName === 'LANDING_GEAR') {
        if (cx < -2.0) {
          // Nose landing gear assembly (strut, wheels, fork, piston, collar)
          if (lower.includes('door')) {
            vec.set(-0.6, -1.2, cz >= 0 ? 0.9 : -0.9);
          } else {
            vec.set(-1.0, -2.5, 0.0);
          }
        } else {
          // Main landing gear assemblies (Left & Right)
          const lat = cz >= 0 ? 2.2 : -2.2;
          if (lower.includes('door')) {
            vec.set(0.0, -1.0, cz >= 0 ? 2.0 : -2.0);
          } else {
            vec.set(0.2, -2.5, lat);
          }
        }
        return vec;
      }

      // 2. HYDRAULICS
      if (systemName === 'HYDRAULICS') {
        if (Math.abs(cz) > 1.0 || lower.includes('wing')) {
          // Wing hydraulic lines & actuators slide outward along wings
          const lat = cz >= 0 ? 3.4 : -3.4;
          vec.set(0.2, 0.2, lat);
        } else if (cx < -2.0 || lower.includes('nose')) {
          // Nose brake hoses & steering cylinders move with nose gear
          vec.set(-0.9, -2.2, 0.0);
        } else if (lower.includes('gear') || lower.includes('brake')) {
          // Main gear hydraulic lines drop down & out with gear
          const lat = cz >= 0 ? 1.8 : -1.8;
          vec.set(0.1, -2.2, lat);
        } else if (cx > 4.5 || cy > 2.7 || lower.includes('trailing')) {
          // Tail / rudder actuators lift up and aft with tail
          const lat = cz >= 0 ? 0.3 : -0.3;
          vec.set(1.2, 2.8, lat);
        } else {
          // Central fuselage hydraulic manifolds, accumulators, pumps, filters
          if (cz > 0.2) vec.set(0.0, 0.3, 2.0);
          else if (cz < -0.2) vec.set(0.0, 0.3, -2.0);
          else if (cy > 2.2) vec.set(0.0, 1.8, 0.0);
          else vec.set(0.0, -1.4, 0.0);
        }
        return vec;
      }

      // 3. FUEL SYSTEM
      if (systemName === 'FUEL') {
        if (Math.abs(cz) > 0.8 || lower.includes('tank')) {
          // External wing drop tanks drop down and push out under wings
          const lat = cz >= 0 ? 2.8 : -2.8;
          vec.set(0.0, -2.2, lat);
        } else {
          // Internal fuselage fuel cells lift upward out of center bay
          vec.set(0.0, 2.5, 0.0);
        }
        return vec;
      }

      // 4. ENGINE
      if (systemName === 'ENGINE') {
        if (lower.includes('drum') || cx < 1.5) {
          // Forward engine intake drum slides forward
          vec.set(-1.8, 0.0, 0.0);
        } else if (
          lower.includes('turbine') ||
          lower.includes('rotor hub') ||
          lower.includes('blade') ||
          lower.includes('retaining ring')
        ) {
          // Multistage axial compressor & turbine disks separate along the engine shaft axis
          // 7 stages distributed between X=1.83 and X=3.87, centered around 2.85
          const stageX = (cx - 2.85) * 1.8;
          vec.set(stageX, 0.0, 0.0);
        } else if (lower.includes('shaft')) {
          // Engine central shaft
          vec.set(0.2, 0.0, 0.0);
        } else if (
          lower.includes('combust') ||
          lower.includes('chamber') ||
          lower.includes('band') ||
          lower.includes('lining')
        ) {
          // Annular combustion chamber & burner nozzles slide aft and bloom radially outward
          const dy = cy - 2.23;
          const dz = cz;
          vec.set(2.4, dy * 0.8, dz * 0.8);
        } else if (lower.includes('sleeve') || lower.includes('collar')) {
          // Aft engine sleeve and collars slide aft
          vec.set(3.6, 0.0, 0.0);
        } else if (
          lower.includes('nozzle') ||
          lower.includes('petal') ||
          lower.includes('lip') ||
          lower.includes('dark exhaust')
        ) {
          // Variable exhaust nozzle & convergent-divergent petals slide aft and bloom outward
          const dy = cy - 2.23;
          const dz = cz;
          vec.set(4.8, dy * 1.2, dz * 1.2);
        } else if (
          lower.includes('casing') ||
          lower.includes('envelope') ||
          lower.includes('service line') ||
          lower.includes('flange bolt') ||
          lower.includes('support hoop')
        ) {
          // Engine cowlings and outer casings peel outward radially
          if (cz > 0.1) vec.set(0.5, 0.3, 2.0);
          else if (cz < -0.1) vec.set(0.5, 0.3, -2.0);
          else if (cy > 2.4) vec.set(0.5, 2.0, 0.0);
          else vec.set(0.5, -1.5, 0.0);
        } else {
          vec.set(2.0, 0.0, 0.0);
        }
        return vec;
      }

      // 5. AVIONICS
      if (systemName === 'AVIONICS') {
        if (cx < -5.5 || lower.includes('radome') || lower.includes('probe')) {
          // Nose radome & forward pitot probe slide forward along longitudinal axis
          vec.set(-3.8, 0.0, 0.0);
        } else if (lower.includes('hud')) {
          // Forward Head-Up Display glass lifts up and forward
          vec.set(-0.6, 2.4, 0.0);
        } else if (lower.includes('instrument') || lower.includes('display')) {
          // Cockpit instrument consoles & MFDs lift up out of the cockpit
          vec.set(-0.3, 1.8, cz * 1.5);
        } else if (lower.includes('tray') || Math.abs(cz) > 1.0) {
          // Wing equipment trays slide laterally with the wings
          const lat = cz >= 0 ? 3.4 : -3.4;
          vec.set(0.3, 0.2, lat);
        } else if (lower.includes('antenna')) {
          vec.set(0.0, 2.8, 0.0);
        } else {
          // Fuselage avionics bays, circuit boards, identification plates, cooling ribs
          if (cz > 0.1) vec.set(0.0, 0.5, 2.4);
          else if (cz < -0.1) vec.set(0.0, 0.5, -2.4);
          else vec.set(0.0, 2.2, 0.0);
        }
        return vec;
      }

      // 6. FLIGHT CONTROL
      if (systemName === 'FLIGHT_CONTROL') {
        if (
          lower.includes('seat') ||
          lower.includes('harness') ||
          lower.includes('head rest') ||
          lower.includes('cushion')
        ) {
          // Tandem ejection seats eject UPWARDS out of cockpit along guide rails
          vec.set(0.3, 3.6, 0.0);
        } else if (lower.includes('stick') || lower.includes('grip')) {
          // Flight control stick lifts slightly
          vec.set(0.0, 1.4, 0.0);
        } else if (lower.includes('rudder')) {
          // Vertical rudder & flight surface braces lift up and slide aft
          vec.set(1.8, 3.6, 0.0);
        } else if (lower.includes('trailing')) {
          // Wing trailing control surfaces slide aft and outward with wings
          const lat = cz >= 0 ? 3.4 : -3.4;
          vec.set(1.2, -0.2, lat);
        } else {
          vec.set(0.0, 2.0, 0.0);
        }
        return vec;
      }

      // 7. ELECTRICAL
      if (systemName === 'ELECTRICAL') {
        if (cx < -2.0 || lower.includes('loom')) {
          // Forward wiring loom slides forward and lifts up
          vec.set(-1.2, 1.4, 0.0);
        } else if (lower.includes('wingtip') || Math.abs(cz) > 2.0) {
          // Wingtip navigation & formation lights move outward with wingtips
          const lat = cz >= 0 ? 4.2 : -4.2;
          vec.set(0.3, 0.1, lat);
        } else if (lower.includes('marker') || lower.includes('tail')) {
          // Tail marker lights move up and aft with vertical stabilizer
          vec.set(1.5, 3.5, 0.0);
        } else {
          // Fuselage wiring runs and power distribution lines
          if (cz > 0.2) vec.set(0.0, 0.2, 1.8);
          else if (cz < -0.2) vec.set(0.0, 0.2, -1.8);
          else if (cy > 2.2) vec.set(0.0, 1.8, 0.0);
          else vec.set(0.0, -1.2, 0.0);
        }
        return vec;
      }

      // 8. AIRFRAME
      if (cx < -5.5 || lower.includes('radome')) {
        // Forward nose cone & pitot mount slide forward
        vec.set(-3.5, 0.0, 0.0);
      } else if (lower.includes('canopy')) {
        // Cockpit canopy arch & transparent glazing lift high above fuselage
        vec.set(-0.5, 3.2, 0.0);
      } else if (
        lower.includes('fin') ||
        lower.includes('dorsal tail') ||
        (cx > 4.5 && cy > 2.7)
      ) {
        // Main swept vertical fin & dorsal tail fairing lift up and aft
        vec.set(1.5, 3.2, 0.0);
      } else if (lower.includes('wing') || Math.abs(cz) > 1.2) {
        // Left & Right wings (panels, ribs, spars, fairings) explode OUTWARD laterally
        const dist = Math.abs(cz) - 1.2;
        const lat = (3.6 + dist * 0.3) * (cz >= 0 ? 1 : -1);
        vec.set(0.3, 0.2, lat);
      } else if (
        lower.includes('skin') ||
        lower.includes('hatch') ||
        lower.includes('dorsal panel') ||
        lower.includes('panel rib')
      ) {
        // Exterior fuselage cutaway skins & access hatches peel away radially
        if (cy > 2.5) {
          vec.set(0.0, 2.2, cz * 0.8);
        } else if (cz > 0.3) {
          vec.set(0.0, 0.3, 2.2);
        } else if (cz < -0.3) {
          vec.set(0.0, 0.3, -2.2);
        } else {
          vec.set(0.0, -1.8, cz * 0.8);
        }
      } else if (lower.includes('intake')) {
        // Engine side air intake housings slide outward laterally
        const lat = cz >= 0 ? 2.0 : -2.0;
        vec.set(-0.5, -0.2, lat);
      } else {
        // Internal central structural skeleton (bulkhead frames, rails, fasteners) expands subtly
        const dy = (cy - 2.23) * 0.4;
        const dz = cz * 0.5;
        vec.set(0.0, dy, dz);
      }

      return vec;
    }

    // Three.js Scene Setup (Locked to deep dark slate background)
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    const DARK_BG = 0x0e1726;
    scene.background = new THREE.Color(DARK_BG);

    const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(-6, 9, 18);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, powerPreference: 'high-performance' });
    renderer.setClearColor(DARK_BG, 1.0);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.2;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    container.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.target.set(-0.25, 2.0, 0);
    controls.maxDistance = 50;
    controls.minDistance = 2;

    // Studio Lighting
    const ambientLight = new THREE.AmbientLight(0xdbeafe, 0.7);
    scene.add(ambientLight);

    const hemiLight = new THREE.HemisphereLight(0xe2e8f0, 0x1e293b, 0.7);
    scene.add(hemiLight);

    const keyLight = new THREE.DirectionalLight(0xffffff, 1.6);
    keyLight.position.set(-5, 14, 12);
    scene.add(keyLight);

    const fillLight = new THREE.DirectionalLight(0x93c5fd, 0.9);
    fillLight.position.set(5, 10, -10);
    scene.add(fillLight);

    const rimLight = new THREE.DirectionalLight(0x60a5fa, 1.2);
    rimLight.position.set(-2, 5, -12);
    scene.add(rimLight);

    const floorLight = new THREE.DirectionalLight(0x38bdf8, 0.5);
    floorLight.position.set(0, -5, 0);
    scene.add(floorLight);

    // Grid Floor (placed below lowest exploded parts so components float cleanly in studio)
    const gridHelper = new THREE.GridHelper(50, 50, 0x334155, 0x1e293b);
    gridHelper.position.y = -2.6;
    scene.add(gridHelper);

    // State Variables
    let jetModel = null;
    const classifiedMeshes = [];
    const turbineBlades = [];
    const shellMaterials = new Set();

    // Raycaster for Part Selection
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();

    // UI Elements
    const sliderShell = document.getElementById('slider-shell');
    const sliderExplode = document.getElementById('slider-explode');
    const explodeValSpan = document.getElementById('explode-val');
    const btnExplodeToggle = document.getElementById('btn-explode-toggle');
    const chkAnimate = document.getElementById('chk-animate');
    const btnIsolateEngine = document.getElementById('btn-isolate-engine');
    const btnShowAll = document.getElementById('btn-show-all');
    const btnExportGlb = document.getElementById('btn-export-glb');
    const selectedPartName = document.getElementById('selected-part-name');
    const selectedPartSystem = document.getElementById('selected-part-system');
    const loadingIndicator = document.getElementById('loading-indicator');
    const statusMsg = document.getElementById('status-msg');

    // Robust Model Loader (uses ArrayBuffer parse to bypass file:// CORS completely)
    const loader = new THREE.GLTFLoader();

    function loadModel() {
      if (window.JET_MODEL_DATA && window.JET_MODEL_DATA.length > 100) {
        statusMsg.textContent = 'Parsing embedded 3D aircraft...';
        try {
          const base64Str = window.JET_MODEL_DATA.split(',')[1];
          const binaryString = atob(base64Str);
          const len = binaryString.length;
          const bytes = new Uint8Array(len);
          for (let i = 0; i < len; i++) {
            bytes[i] = binaryString.charCodeAt(i);
          }
          loader.parse(bytes.buffer, '', onModelLoaded, (err) => {
            console.warn('Direct parse failed, trying loader.load:', err);
            loader.load(window.JET_MODEL_DATA, onModelLoaded, undefined, fallbackFileLoad);
          });
          return;
        } catch (e) {
          console.warn('Data URI parse error:', e);
          loader.load(window.JET_MODEL_DATA, onModelLoaded, undefined, fallbackFileLoad);
          return;
        }
      }
      fallbackFileLoad();
    }

    function fallbackFileLoad() {
      statusMsg.textContent = 'Loading cutaway_jet.glb...';
      loader.load('cutaway_jet.glb', onModelLoaded, undefined, (err) => {
        statusMsg.textContent = 'Unable to load model file directly.';
      });
    }

    function onModelLoaded(gltf) {
      jetModel = gltf.scene;
      scene.add(jetModel);
      jetModel.updateMatrixWorld(true);

      // Model Bounding Box Center
      const box = new THREE.Box3().setFromObject(jetModel);
      const modelCenter = box.getCenter(new THREE.Vector3());
      controls.target.copy(modelCenter);

      // Process and classify all meshes
      jetModel.traverse((child) => {
        if (child.isMesh) {
          const lowerName = child.name.toLowerCase();

          // Exclude any studio floor, default cube, or background helper meshes
          if (lowerName.includes('floor') || lowerName.includes('cube') || lowerName.includes('camera') || lowerName.includes('light')) {
            child.visible = false;
            return;
          }

          const sysName = classifyMeshSystem(child.name);
          child.userData.system = sysName;

          // Compute accurate world bounding center BEFORE modifying geometry
          const meshBox = new THREE.Box3().setFromObject(child);
          const worldCenter = meshBox.getCenter(new THREE.Vector3());
          child.userData.worldCenter = worldCenter.clone();

          // Center turbine rotor disks on shaft axis so in-place spinning works
          if (
            lowerName.includes('turbine') ||
            lowerName.includes('rotor hub') ||
            lowerName.includes('retaining ring')
          ) {
            // Shift vertices so shaft axis (worldCenter.y, worldCenter.z) is at local (0, 0)
            child.geometry.translate(0, -worldCenter.y, -worldCenter.z);
            child.geometry.computeBoundingBox();
            child.geometry.computeBoundingSphere();
            // Move mesh object position to the shaft axis so visual position is identical
            child.position.set(child.position.x, worldCenter.y, worldCenter.z);
            turbineBlades.push(child);
          }

          child.userData.origPos = child.position.clone();
          child.userData.explodeVec = getExplosionVector(child, sysName, worldCenter, modelCenter);

          classifiedMeshes.push(child);

          // Handle canopy glass separately from airframe shell
          if (child.material) {
            const mat = child.material;
            const matName = (mat.name || '').toLowerCase();
            if (matName.includes('canopy')) {
              mat.transparent = true;
              mat.opacity = 0.22;
              mat.depthWrite = false;
              mat.roughness = 0.04;
              mat.metalness = 0.0;
            } else if (matName.includes('skin') || matName.includes('wing panel') || matName.includes('fuselage') || matName.includes('transparent')) {
              shellMaterials.add(mat);
            }
          }
        }
      });

      // Initialize shell opacity
      updateShellOpacity(parseFloat(sliderShell.value));

      loadingIndicator.style.display = 'none';
      console.log(`Model successfully initialized with ${classifiedMeshes.length} components.`);
    }

    loadModel();

    // Systems Visibility Toggle
    const systemCheckboxes = document.querySelectorAll('.checkbox-list input[type="checkbox"]');
    systemCheckboxes.forEach((chk) => {
      chk.addEventListener('change', () => {
        const sys = chk.getAttribute('data-system');
        const isVisible = chk.checked;

        classifiedMeshes.forEach((mesh) => {
          if (mesh.userData.system === sys) {
            mesh.visible = isVisible;
          }
        });
      });
    });

    // Shell Opacity Slider
    function updateShellOpacity(val) {
      shellMaterials.forEach((mat) => {
        mat.opacity = Math.max(0.01, Math.min(1.0, val));
        mat.transparent = val < 0.99;
        mat.depthWrite = val >= 0.99;
        mat.needsUpdate = true;
      });
    }
    sliderShell.addEventListener('input', (e) => {
      updateShellOpacity(parseFloat(e.target.value));
    });

    // Explode Controller
    let explodeAnimId = null;

    function setExplodeFactor(factor) {
      factor = Math.max(0, Math.min(1, factor));
      sliderExplode.value = factor;
      const pct = Math.round(factor * 100);
      if (explodeValSpan) explodeValSpan.textContent = `${pct}%`;
      if (btnExplodeToggle) {
        btnExplodeToggle.textContent = factor > 0.5 ? 'Collapse view' : 'Explode view';
      }

      classifiedMeshes.forEach((mesh) => {
        const orig = mesh.userData.origPos;
        const vec = mesh.userData.explodeVec;
        mesh.position.set(
          orig.x + vec.x * factor,
          orig.y + vec.y * factor,
          orig.z + vec.z * factor
        );
      });
      if (jetModel) jetModel.updateMatrixWorld(true);
    }

    function animateExplodeTo(targetFactor, duration = 850) {
      if (explodeAnimId) cancelAnimationFrame(explodeAnimId);
      const startFactor = parseFloat(sliderExplode.value);
      const startTime = performance.now();

      function step(now) {
        const elapsed = now - startTime;
        const progress = Math.min(1, elapsed / duration);
        // Smooth easeInOutCubic
        const ease = progress < 0.5
          ? 4 * progress * progress * progress
          : 1 - Math.pow(-2 * progress + 2, 3) / 2;
        const currentFactor = startFactor + (targetFactor - startFactor) * ease;
        setExplodeFactor(currentFactor);

        if (progress < 1) {
          explodeAnimId = requestAnimationFrame(step);
        } else {
          explodeAnimId = null;
        }
      }
      explodeAnimId = requestAnimationFrame(step);
    }

    sliderExplode.addEventListener('input', (e) => {
      if (explodeAnimId) {
        cancelAnimationFrame(explodeAnimId);
        explodeAnimId = null;
      }
      setExplodeFactor(parseFloat(e.target.value));
    });

    if (btnExplodeToggle) {
      btnExplodeToggle.addEventListener('click', () => {
        const current = parseFloat(sliderExplode.value);
        const target = current > 0.5 ? 0.0 : 1.0;
        animateExplodeTo(target, 850);
      });
    }

    // Isolate Engine Button
    btnIsolateEngine.addEventListener('click', () => {
      systemCheckboxes.forEach((chk) => {
        const sys = chk.getAttribute('data-system');
        chk.checked = (sys === 'ENGINE');
        classifiedMeshes.forEach((mesh) => {
          if (mesh.userData.system === sys) {
            mesh.visible = chk.checked;
          }
        });
      });
      selectPart('Engine Core', 'ENGINE');
      // Focus camera on engine centerline
      controls.target.set(3.5, 2.23, 0);
    });

    // Show All Button
    btnShowAll.addEventListener('click', () => {
      systemCheckboxes.forEach((chk) => {
        chk.checked = true;
      });
      classifiedMeshes.forEach((mesh) => {
        mesh.visible = true;
      });
      selectPart('Full Aircraft', 'AIRFRAME');
      if (jetModel) {
        const box = new THREE.Box3().setFromObject(jetModel);
        controls.target.copy(box.getCenter(new THREE.Vector3()));
      }
    });

    // Export GLB Button
    btnExportGlb.addEventListener('click', () => {
      if (!jetModel) return;
      btnExportGlb.textContent = 'Exporting...';

      const exporter = new THREE.GLTFExporter();
      exporter.parse(
        jetModel,
        (result) => {
          const blob = new Blob([result], { type: 'model/gltf-binary' });
          const link = document.createElement('a');
          link.href = URL.createObjectURL(blob);
          link.download = 'cutaway_jet_custom.glb';
          link.click();
          btnExportGlb.textContent = 'Export GLB';
        },
        { binary: true }
      );
    });

    // Raycast on Pointer Click
    window.addEventListener('pointerdown', (event) => {
      if (event.target.closest('.systems-panel') || event.target.closest('header')) {
        return;
      }

      mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);
      const visibleMeshes = classifiedMeshes.filter(m => m.visible);
      const intersects = raycaster.intersectObjects(visibleMeshes, false);

      if (intersects.length > 0) {
        const hit = intersects[0].object;
        const partName = hit.name || 'Aircraft Component';
        const sysName = hit.userData.system || 'AIRFRAME';
        selectPart(partName, sysName);
      }
    });

    function selectPart(name, system) {
      const cleanName = name.replace(/\.\d+$/, '');
      selectedPartName.textContent = cleanName;
      selectedPartSystem.textContent = system;

      // Highlight corresponding checkbox in panel
      const chk = document.getElementById(`chk-${system}`);
      if (chk) {
        chk.parentElement.style.color = '#0284c7';
        setTimeout(() => {
          chk.parentElement.style.color = '#1e293b';
        }, 800);
      }
    }

    // Top Header View Switching
    const btn3dView = document.getElementById('btn-3d-view');
    const btnRenderView = document.getElementById('btn-render-view');
    const btnResetCam = document.getElementById('btn-reset-cam');
    const renderOverlay = document.getElementById('render-overlay');

    btn3dView.addEventListener('click', () => {
      btn3dView.classList.add('active');
      btnRenderView.classList.remove('active');
      renderOverlay.classList.remove('active');
    });

    btnRenderView.addEventListener('click', () => {
      btnRenderView.classList.add('active');
      btn3dView.classList.remove('active');
      renderOverlay.classList.add('active');
    });

    btnResetCam.addEventListener('click', () => {
      controls.reset();
      camera.position.set(-6, 9, 18);
      if (jetModel) {
        const box = new THREE.Box3().setFromObject(jetModel);
        controls.target.copy(box.getCenter(new THREE.Vector3()));
      }
    });

    // Resize Handler
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // Animation Loop (Rotates turbine stages in-place around engine centerline)
    let clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);

      const delta = clock.getDelta();

      // In-place rotation around engine shaft axis
      if (chkAnimate.checked && turbineBlades.length > 0) {
        const rotSpeed = delta * 12.0;
        turbineBlades.forEach((blade) => {
          blade.rotation.x += rotSpeed;
        });
      }

      controls.update();
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
